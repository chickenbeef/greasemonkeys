name: Update Userscript URLs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.user.js'

permissions:
  contents: write

jobs:
  update-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inject or update URLs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - << 'EOF'
          import os, subprocess, re

          repo = os.environ.get("GITHUB_REPOSITORY")
          branch = os.environ.get("GITHUB_REF_NAME", "main")
          before = os.environ.get("BEFORE_SHA")
          after = os.environ.get("AFTER_SHA")

          # Inspect added, copied, modified, or renamed .user.js files
          if before and before != "0000000000000000000000000000000000000000":
              cmd = ["git", "diff", "--name-only", "--diff-filter=ACMR", before, after]
          else:
              cmd = ["git", "diff", "--name-only", "--diff-filter=ACMR", "HEAD~1", "HEAD"]

          try:
              res = subprocess.run(cmd, capture_output=True, text=True, check=True)
              changed_files = [f.strip() for f in res.stdout.splitlines() if f.strip().endswith(".user.js")]
          except Exception:
              changed_files = []
              for root, _, files in os.walk("."):
                  for file in files:
                      if file.endswith(".user.js"):
                          changed_files.append(os.path.relpath(os.path.join(root, file), "."))

          for rel_path in changed_files:
              rel_path = rel_path.lstrip("./").replace("\\", "/")
              if not os.path.isfile(rel_path):
                  continue

              with open(rel_path, "r", encoding="utf-8") as f:
                  content = f.read()

              match = re.search(r"(//\s*==UserScript==[\s\S]*?)(//\s*==/UserScript==)", content)
              if not match:
                  continue

              body = match.group(1)
              footer = match.group(2)
              target_url = f"https://raw.githubusercontent.com/{repo}/{branch}/{rel_path}"

              has_update = bool(re.search(r"^\s*//\s*@updateURL\b", body, re.MULTILINE))
              has_download = bool(re.search(r"^\s*//\s*@downloadURL\b", body, re.MULTILINE))

              # Replace existing URLs
              if has_update:
                  body = re.sub(r"^(\s*//\s*@updateURL\s+)\S+", rf"\g<1>{target_url}", body, flags=re.MULTILINE)
              if has_download:
                  body = re.sub(r"^(\s*//\s*@downloadURL\s+)\S+", rf"\g<1>{target_url}", body, flags=re.MULTILINE)

              # Inject missing tags before the closing block
              to_add = []
              if not has_update:
                  to_add.append(f"// @updateURL    {target_url}")
              if not has_download:
                  to_add.append(f"// @downloadURL  {target_url}")

              if to_add:
                  if not body.endswith("\n"):
                      body += "\n"
                  body += "\n".join(to_add) + "\n"

              new_content = content[:match.start()] + body + footer + content[match.end():]

              if new_content != content:
                  with open(rel_path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Updated metadata for: {rel_path}")
              else:
                  print(f"Already up to date: {rel_path}")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync userscript update/download URLs [skip ci]"
            git push
          else
            echo "No URL changes required."
          fi
